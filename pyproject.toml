[project]
name = "mcp-kubectl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "kubernetes>=32.0.1",
    "mcp[cli]>=1.4.1",
    "pylint>=3.3.6",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
asyncio_default_fixture_loop_scope = "function"

[tool.pylint]
# Add directories/files to ignore (use TOML array of strings)
# This will ignore the top-level .venv directory
ignore = [".venv"]

# You can add other pylint configurations here as well
# For example:
# disable = ["C0114", "C0116"] # Disable specific checks
# max-line-length = 100
